services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookworm
      POSTGRES_PASSWORD: bookworm
      POSTGRES_DB: bookworm
    ports:
      - "5433:5432"   # 5433 on the host so it never fights a local Postgres
    volumes:
      - bookworm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookworm -d bookworm"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      BW_ADDR: ":8080"
      BW_DATABASE_URL: "postgres://bookworm:bookworm@db:5432/bookworm?sslmode=disable"
      BW_ENV: "development"
      BW_ALLOW_ORIGINS: "http://localhost:4321,http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bookworm_pgdata:
