server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Pause reservations/status for old cached clients too: they used a successful
    # allowance response to trigger automatic model warm-up on reader reload.
    location = /v1/assistant/local {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"local_ai_paused","message":"On-device AI is temporarily paused. Reading and Plus cloud AI remain available."}';
    }
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /healthz { proxy_pass http://api:8080; }
    location = /local-ai-policy.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /a/ { try_files $uri $uri/index.html $uri.html /a/index.html; }
    location /app/u/ { try_files $uri $uri/index.html $uri.html /app/u/index.html; }
    location /read/ { try_files $uri $uri/index.html $uri.html /read/index.html; }
    location / { try_files $uri $uri/index.html $uri.html =404; }
}
