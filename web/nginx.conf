server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Inline bootstrap scripts are required by Astro islands. No third-party JS;
    # fixed connect destinations reduce exfiltration routes, not operator trust.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.openai.com https://api.anthropic.com https://openrouter.ai; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /healthz { proxy_pass http://api:8080; }
    location /a/ { try_files $uri $uri/index.html $uri.html /a/index.html; }
    location /app/u/ { try_files $uri $uri/index.html $uri.html /app/u/index.html; }
    location /read/ { try_files $uri $uri/index.html $uri.html /read/index.html; }
    location / { try_files $uri $uri/index.html $uri.html =404; }
}
